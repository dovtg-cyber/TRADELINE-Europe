# Render Blueprint: publish the existing frontend from public/ and assemble root-level assets first.
services:
  - type: web
    runtime: static
    name: tradeline-europe
    buildCommand: bash scripts/build-static.sh
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

# The Python APIs are separate web services, not part of this static site.
# Enable/configure each service separately after its backend implementation is deployment-ready.
