# Render Blueprint: static frontend plus the real TRADELINE API.
services:
  - type: web
    runtime: static
    name: tradeline-europe
    buildCommand: bash scripts/build-static.sh
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    runtime: docker
    name: tradeline-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: tradeline-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/tradeline.db
      - key: ALLOWED_ORIGINS
        value: https://tradeline-europe.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
