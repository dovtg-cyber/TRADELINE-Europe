# Render free-tier Blueprint. No disk and no paid resource declarations.
services:
  - type: web
    runtime: static
    name: tradeline-europe
    buildCommand: bash scripts/build-static.sh
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    runtime: docker
    name: tradeline-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://tradeline-europe-u7gw.onrender.com
      - key: DB_PATH
        value: /tmp/tradeline.db
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
